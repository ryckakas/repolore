[project]
name = "repolore"
dynamic = ["version"]
description = "RAG over your own engineering history on GitHub, with a CLI and an MCP server."
readme = "README.md"
authors = [
    { name = "ryckakas", email = "ryckakas@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub>=1.33.0",
    "markdown-it-py>=4.2.0",
    "mcp>=2.3,<3",
    "numpy>=2.5",
    "platformdirs>=4.13.5",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.2.0,<6.3",
    "sqlite-vec>=0.1.9,<0.2",
    "tokenizers>=0.23.3",
    "torch>=2.14.1",
    "typer>=0.27.3",
]

[tool.uv]
# uv's own Python builds load SQLite extensions (sqlite-vec); some system builds, such as python.org's on macOS, can't.
python-preference = "only-managed"
# The version comes from git, so a new commit or tag has to rebuild the editable install for __version__ to follow.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
repolore = "repolore.cli:app"
repolore-mcp = "repolore.mcp_server:main"

[build-system]
# uv_build only takes a literal version; hatch-vcs derives it from the nearest vX.Y.Z tag and the commits since.
requires = ["hatchling>=1.32.4,<2", "hatch-vcs>=0.5.0,<0.6"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[dependency-groups]
dev = [
    "bonsai-lint>=0.5.0",
    "ir-measures>=0.4.3",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not live", "--strict-markers"]
markers = ["live: calls real external APIs (GitHub, Voyage); run with -m live"]

[tool.coverage.run]
source = ["repolore"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

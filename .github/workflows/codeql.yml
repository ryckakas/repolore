name: CodeQL

# Advanced setup rather than GitHub's default setup, because default setup skips pull requests from
# forks, and the "Protect main" ruleset's code_scanning rule then waits on them forever. The
# categories match the ones default setup used, so alerts carry over. The ruleset also requires each
# analyze job by name, so renaming one needs the ruleset updated to match.
#
# No weekly schedule: the pinned action fixes the CodeQL version, so rescanning an unchanged main
# would run the same queries. New queries arrive with a Dependabot bump, which is scanned on its pull
# request and again on main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

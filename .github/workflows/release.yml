name: Release

# PyPI and TestPyPI trust this file. A vX.Y.Z tag publishes that version to PyPI and creates its GitHub Release.
# Dispatched by hand, it rehearses on TestPyPI with a .dev<run number> version, or reruns a failed PyPI publish when
# started at a release tag. A version on PyPI is permanent, so nothing is ever replaced there.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to upload to"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      target: ${{ steps.request.outputs.target }}
      version: ${{ steps.request.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs needs the history and tags to count the commits since the last release.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # A release must not restore what another workflow wrote.
          enable-cache: false
      - name: Check the request
        id: request
        env:
          TARGET: ${{ inputs.target || 'pypi' }}
        run: |
          if [ "$TARGET" = pypi ]; then
            if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::PyPI takes only a release tag vX.Y.Z, not $GITHUB_REF; prereleases are not published"
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::$GITHUB_REF_NAME is not on main"
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          else
            # TestPyPI rejects the local +g<sha> part, and a rerun needs a version it hasn't seen.
            scm=$(uv run --no-project --python 3.12 --with 'hatch-vcs>=0.5.0,<0.6' python -c \
              'from setuptools_scm import get_version; print(get_version(local_scheme="no-local-version"))')
            version="${scm%%.dev*}.dev$GITHUB_RUN_NUMBER"
          fi
          echo "Publishing repolore-mcp $version to $TARGET"
          {
            echo "target=$TARGET"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          TARGET: ${{ steps.request.outputs.target }}
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          # A release builds the version hatch-vcs reads from its tag, which the next step checks.
          if [ "$TARGET" = testpypi ]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="$VERSION"
          fi
          uv build --no-sources
      - name: Check the wheel
        env:
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          wheel="dist/repolore_mcp-$VERSION-py3-none-any.whl"
          if [ ! -f "$wheel" ]; then
            echo "::error::expected $wheel, built: $(ls dist)"
            exit 1
          fi
          uv run --isolated --no-project --python 3.12 --with "$wheel" repolore version | tee version.txt
          grep -qx "repolore $VERSION" version.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ needs.build.outputs.target }}
      url: ${{ needs.build.outputs.target == 'pypi' && 'https://pypi.org/p/repolore-mcp' || 'https://test.pypi.org/p/repolore-mcp' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ needs.build.outputs.target == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}

  github-release:
    needs: [build, publish]
    if: needs.build.outputs.target == 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A rerun of a failed publish finds the release already there.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a GitHub Release"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag

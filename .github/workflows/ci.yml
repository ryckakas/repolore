name: CI

# Every job's name below becomes a GitHub status check, and the "Protect main" ruleset
# (.github/rulesets/protect-main.json) requires each one by that exact name before a PR can merge,
# so a job renamed here needs the ruleset updated to match.
#
# Workflows are audited like code (see the zizmor job): every action is pinned to a full commit
# with its version in a comment, and Dependabot moves both. A tag can be moved to other code; a
# commit cannot.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request supersedes the run already going; main keeps every run so each
# merge has its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run bonsai-lint --format github

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run pyright

  # Windows is load-bearing rather than ceremony: it is the development machine and where installed
  # users run the CLI, and its default cp1252 codec is a known way to break on GitHub content.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run pytest --cov

  # Installs the built wheel in an isolated environment and runs the entry point, which catches a
  # packaging break (missing module, wrong script target) that tests against the source tree can't.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build
      # PyPI's Linux torch wheel bundles CUDA (gigabytes); the CPU build is all repolore uses.
      - run: uv run --isolated --no-project --with dist/*.whl repolore version
        env:
          UV_TORCH_BACKEND: cpu

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # An exact release, since each one adds corrections; Dependabot proposes the next one.
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  # Workflow security: pinned actions, least-privilege tokens, no credentials left behind, no
  # template injection.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # An exact release: new audits arrive with a deliberate bump, not with an unrelated pull
      # request.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: zizmor@1.31.1
      # The token lets zizmor check that every pinned commit belongs to its action's repository.
      - run: zizmor --format github .github
        env:
          GH_TOKEN: ${{ github.token }}

  # Workflow correctness, where zizmor covers security, plus shellcheck over every `run:` block
  # and the git hooks, which have no .sh extension for a glob to find.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint skips the `run:` blocks without a word when shellcheck is missing, so it is
      # installed first, at an exact release.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: shellcheck@0.11.0
      # The release binary, checked against its published SHA-256. Dependabot doesn't see this
      # pin; bump the version and the hash together.
      - name: Install actionlint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - run: '"$RUNNER_TEMP/actionlint"'
      - run: shellcheck .githooks/*

  # Known advisories in uv.lock. Not a required check: an advisory published overnight would
  # otherwise block every pull request, related or not. `uv audit` is still a preview feature.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv audit --locked --preview-features audit-command

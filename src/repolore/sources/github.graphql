query Viewer {
  viewer { login }
}

query RepoInfo($owner: String!, $name: String!) {
  repository(owner: $owner, name: $name) {
    nameWithOwner
    url
    isPrivate
    defaultBranchRef { name target { oid } }
  }
}

query ViewerRepositories($after: String) {
  viewer {
    login
    repositories(
      first: 100
      after: $after
      affiliations: [OWNER, COLLABORATOR, ORGANIZATION_MEMBER]
      ownerAffiliations: [OWNER, COLLABORATOR, ORGANIZATION_MEMBER]
    ) {
      pageInfo { hasNextPage endCursor }
      nodes { nameWithOwner isFork owner { login } }
    }
  }
}

query ViewerOrganizations($after: String) {
  viewer {
    organizations(first: 100, after: $after) {
      pageInfo { hasNextPage endCursor }
      nodes { login repositories { totalCount } }
    }
  }
}

query InvolvedRepositories($query: String!, $after: String) {
  search(query: $query, type: ISSUE, first: 100, after: $after) {
    issueCount
    pageInfo { hasNextPage endCursor }
    nodes {
      ... on PullRequest { repository { nameWithOwner } }
      ... on Issue { repository { nameWithOwner } }
    }
  }
}

query Contributions($query: String!, $after: String) {
  search(query: $query, type: ISSUE, first: 25, after: $after) {
    pageInfo { hasNextPage endCursor }
    nodes {
      __typename
      ... on PullRequest { ...PRFields }
      ... on Issue { ...IssueFields }
    }
  }
}

query RepoPullRequests($owner: String!, $name: String!, $after: String) {
  repository(owner: $owner, name: $name) {
    pullRequests(first: 25, after: $after, orderBy: {field: UPDATED_AT, direction: DESC}) {
      pageInfo { hasNextPage endCursor }
      nodes { ...PRFields }
    }
  }
}

query RepoIssues($owner: String!, $name: String!, $after: String) {
  repository(owner: $owner, name: $name) {
    issues(first: 50, after: $after, orderBy: {field: UPDATED_AT, direction: DESC}) {
      pageInfo { hasNextPage endCursor }
      nodes { ...IssueFields }
    }
  }
}

query RepoBranches($owner: String!, $name: String!, $after: String) {
  repository(owner: $owner, name: $name) {
    refs(refPrefix: "refs/heads/", first: 100, after: $after) {
      pageInfo { hasNextPage endCursor }
      nodes { name target { oid } }
    }
  }
}

query CommitHistory($owner: String!, $name: String!, $tip: GitObjectID!, $after: String) {
  repository(owner: $owner, name: $name) {
    object(oid: $tip) {
      ... on Commit {
        history(first: 100, after: $after) {
          pageInfo { hasNextPage endCursor }
          nodes {
            oid
            url
            messageHeadline
            messageBody
            authoredDate
            committedDate
            parents(first: 10) { totalCount nodes { oid } }
            author { name user { login } }
          }
        }
      }
    }
  }
}

fragment IssueFields on Issue {
  number
  title
  body
  url
  state
  createdAt
  updatedAt
  author { login __typename }
  comments(first: 100) {
    totalCount
    nodes { author { login __typename } body createdAt }
  }
}

fragment PRFields on PullRequest {
  number
  title
  body
  url
  state
  createdAt
  updatedAt
  mergeCommit { oid }
  headRefName
  isCrossRepository
  author { login __typename }
  files(first: 100) {
    totalCount
    nodes { path }
  }
  commits(first: 100) {
    totalCount
    nodes { commit { oid messageHeadline messageBody } }
  }
  comments(first: 100) {
    totalCount
    nodes { author { login __typename } body createdAt }
  }
  reviews(first: 50) {
    totalCount
    nodes { author { login __typename } body createdAt }
  }
  reviewThreads(first: 100) {
    totalCount
    nodes {
      isResolved
      isOutdated
      path
      line
      originalLine
      comments(first: 50) {
        totalCount
        nodes { author { login __typename } body createdAt url diffHunk }
      }
    }
  }
}

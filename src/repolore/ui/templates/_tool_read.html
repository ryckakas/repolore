<label for="url">URL of a search result</label>
<input type="text" id="url" name="url" required spellcheck="false">
<div class="fields">
  <div class="wider">
    <label for="section">Section</label>
    <input type="text" id="section" name="section" placeholder="every section" spellcheck="false">
  </div>
  <div>
    <label for="start">Start</label>
    <input type="number" id="start" name="start" min="0" value="0">
  </div>
</div>
